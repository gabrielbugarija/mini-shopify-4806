spring.application.name=mini-shopify-4806

#Database

spring.datasource.url=jdbc:h2:file:${HOME:.}/mini-shopify-data/minishopify;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

#JPA/Hibernate
# "update" = create missing tables/columns on startup, never drop existing data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false