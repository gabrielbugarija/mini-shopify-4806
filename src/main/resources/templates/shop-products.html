<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Products</title>
</head>
<body>

<h1 th:text="${shop.name} + ' - Manage Products'">Manage Products</h1>

<a th:href="@{/merchant}">Back to Dashboard</a>

<h2>Products</h2>

<p th:if="${#lists.isEmpty(products)}">
    No products in this shop yet.
</p>

<div th:each="product : ${products}">
    <h3 th:text="${product.name}">Product Name</h3>
    <p>Price: $<span th:text="${product.price}"></span></p>
    <p>Quantity: <span th:text="${product.quantity}"></span></p>
    <hr>
</div>

<h2>Add a Product</h2>

<form th:action="@{/merchant/shops/{id}/products(id=${shop.id})}" method="post">
    <label>Product Name:</label>
    <input type="text" name="name" required>
    <br><br>
    <label>Price:</label>
    <input type="number" name="price" step="0.01" min="0" required>
    <br><br>
    <label>Quantity:</label>
    <input type="number" name="quantity" min="0" required>
    <br><br>
    <button type="submit">Add Product</button>
</form>

</body>
</html>
