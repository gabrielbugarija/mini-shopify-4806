<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Product Details</title>
</head>
<body>
<nav aria-label="Interface"><a th:href="@{/}">Shopper</a> | <a th:href="@{/merchant}">Switch to merchant</a></nav>

<h1 th:text="${product.name}">Product Name</h1>

<p>
    Price: $<span th:text="${product.price}">0.00</span>
</p>

<p>
    Available Quantity:
    <span th:text="${product.quantity}">0</span>
</p>

<p th:if="${!#sets.isEmpty(product.tags)}">
    Tags: <span th:text="${#strings.setJoin(product.tags, ', ')}">tags</span>
</p>

<a th:href="@{/}">Back to Shops and Products</a>

<form th:action="@{/products/{id}/purchase-page(id=${product.id})}"
      method="post">

    <label for="amount">Quantity:</label>

    <input type="number"
           id="amount"
           name="amount"
           value="1"
           min="1"
           th:max="${product.quantity}"
           required>

    <button type="submit"
            th:disabled="${product.quantity <= 0}">
        Purchase
    </button>
</form>
</body>
</html>
