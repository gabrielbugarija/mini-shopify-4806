<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a Shop | Mini Shopify</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>
    <h2>Mini Shopify</h2>
    <nav aria-label="Interface"><a th:href="@{/}">Switch to shopper</a> | <strong>Merchant</strong></nav>
</header>

<main class="narrow">
    <a class="back-link" th:href="@{/merchant}">&larr; Back to dashboard</a>

    <h1>Create a Shop</h1>

    <form class="form-card" th:action="@{/merchant/shops/create}" method="post">
        <div class="form-field">
            <label for="shop-name">Shop name</label>
            <input id="shop-name" type="text" name="name" th:value="${name}" required>
            <p th:if="${errorMessage}" th:text="${errorMessage}" role="alert"></p>
        </div>

        <div class="form-field">
            <label for="shop-description">Description</label>
            <textarea id="shop-description" name="description" rows="4" maxlength="1000"
                      th:text="${description}" placeholder="What does your shop sell?"></textarea>
        </div>

        <div class="form-field">
            <label for="shop-tags">Categories</label>
            <input id="shop-tags" type="text" name="tagsText"
                   th:value="${tagsText}" placeholder="Clothing, Electronics">
            <small>Separate categories with commas.</small>
        </div>

        <div class="form-actions">
            <button type="submit">Create Shop</button>
            <a th:href="@{/merchant}">Cancel</a>
        </div>
    </form>
</main>

</body>
</html>
