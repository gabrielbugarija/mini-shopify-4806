<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merchant - Mini Shopify</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: whitesmoke; color: #333; }
        header { padding: 20px; background: #222; color: white; text-align: center; }
        header a { color: white; }
        main { max-width: 900px; margin: auto; padding: 24px; }
        .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 25px; }
        .shop-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        .action-button { display: inline-block; padding: 10px 16px; background: #222; color: white; text-decoration: none; border-radius: 4px; margin-top: 10px; }
    </style>
</head>
<body>
<header>
    <h2>Mini Shopify</h2>
    <nav aria-label="Interface"><a th:href="@{/}">Switch to shopper</a> | <strong>Merchant</strong></nav>
</header>
<main>
    <h1>Merchant dashboard</h1>
    <a class="action-button" th:href="@{/merchant/shops/create}">Create a Shop</a>
    <h2>My Shops</h2>
    <p th:if="${#lists.isEmpty(shops)}">
        You haven't created any shops yet.
    </p>
    <div class="shop-grid">
        <article class="shop-card" th:each="shop : ${shops}">
            <h3 th:text="${shop.name}">Shop Name</h3>

            <p th:text="${shop.description}">Shop Description</p>

            <p th:if="${!#sets.isEmpty(shop.tags)}"
               th:text="${#strings.setJoin(shop.tags, ', ')}">
                Categories
            </p>

            <a class="action-button"
               th:href="@{/merchant/shops/{id}/products(id=${shop.id})}">
                Manage Products
            </a>
        </article>
    </div>
</main>
</body>
</html>
