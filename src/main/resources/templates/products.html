<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Products | Mini Shopify</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>
    <h2>Mini Shopify</h2>
    <nav aria-label="Interface"><a th:href="@{/}">Shopper</a> | <a th:href="@{/merchant}">Switch to merchant</a></nav>
</header>

<main>
    <a class="back-link" th:href="@{/}">&larr; Back to shops</a>

    <h1>Our Products</h1>

    <p th:if="${#lists.isEmpty(products)}">No products available yet.</p>

    <div class="product-grid">
        <article class="product-card" th:each="product : ${products}">
            <h2 th:text="${product.name}">Product Name</h2>

            <p class="price" th:text="'$' + ${#numbers.formatDecimal(product.price, 1, 'COMMA', 2, 'POINT')}">$0.00</p>

            <p class="stock sold-out" th:if="${product.quantity <= 0}">Sold out</p>
            <p class="stock" th:if="${product.quantity > 0}"
               th:text="${product.quantity} + ' in stock'">10 in stock</p>

            <ul class="tags" th:if="${!#sets.isEmpty(product.tags)}" aria-label="Tags">
                <li th:each="tag : ${product.tags}" th:text="${tag}">tag</li>
            </ul>

            <a class="view-product" th:href="@{/products/{id}/page(id=${product.id})}">View product</a>
        </article>
    </div>
</main>
</body>
</html>
