
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Our Products</title>
</head>
<body>
<nav aria-label="Interface"><a th:href="@{/}">Shopper</a> | <a th:href="@{/merchant}">Switch to merchant</a></nav>

<h1>Our Products</h1>

<a th:href="@{/}">Back to shops</a>

<div th:each="product : ${products}">
    <h2 th:text="${product.name}">Product Name</h2>

    <p>
        Price: $<span th:text="${product.price}">0.00</span>
    </p>

    <p>
        Quantity: <span th:text="${product.quantity}">0</span>
    </p>

    <p th:if="${!#sets.isEmpty(product.tags)}">
        Tags: <span th:text="${#strings.setJoin(product.tags, ', ')}">tags</span>
    </p>

    <a th:href="@{/products/{id}/page(id=${product.id})}">
        View Product
    </a>

    <hr>
</div>

</body>
</html>
