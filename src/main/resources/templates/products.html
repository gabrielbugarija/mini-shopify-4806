<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Products | Mini Shopify</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: whitesmoke;
            color: #333;
        }

        header {
            background-color: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header a {
            color: white;
        }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 20px 48px;
        }

        .back-link {
            color: #333;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 24px;
        }

        .product-card {
            display: flex;
            flex-direction: column;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .product-card h2 {
            font-size: 20px;
            margin: 0 0 8px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            margin: 0 0 8px;
        }

        .stock {
            margin: 0 0 12px;
            font-size: 14px;
            color: #666;
        }

        .stock.sold-out {
            color: #a12626;
            font-weight: bold;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            list-style: none;
            padding: 0;
            margin: 0 0 16px;
        }

        .tags li {
            padding: 3px 8px;
            border-radius: 12px;
            background-color: #eee;
            font-size: 13px;
        }

        .view-product {
            margin-top: auto;
            display: block;
            padding: 10px 16px;
            border-radius: 4px;
            background-color: #222;
            color: white;
            text-align: center;
            text-decoration: none;
        }
    </style>
</head>
<body>
<header>
    <h2>Mini Shopify</h2>
    <nav aria-label="Interface"><a th:href="@{/}">Shopper</a> | <a th:href="@{/merchant}">Switch to merchant</a></nav>
</header>

<main>
    <a class="back-link" th:href="@{/}">&larr; Back to shops</a>

    <h1>Our Products</h1>

    <p th:if="${#lists.isEmpty(products)}">No products available yet.</p>

    <div class="product-grid">
        <article class="product-card" th:each="product : ${products}">
            <h2 th:text="${product.name}">Product Name</h2>

            <p class="price" th:text="'$' + ${#numbers.formatDecimal(product.price, 1, 'COMMA', 2, 'POINT')}">$0.00</p>

            <p class="stock sold-out" th:if="${product.quantity <= 0}">Sold out</p>
            <p class="stock" th:if="${product.quantity > 0}"
               th:text="${product.quantity} + ' in stock'">10 in stock</p>

            <ul class="tags" th:if="${!#sets.isEmpty(product.tags)}" aria-label="Tags">
                <li th:each="tag : ${product.tags}" th:text="${tag}">tag</li>
            </ul>

            <a class="view-product" th:href="@{/products/{id}/page(id=${product.id})}">View product</a>
        </article>
    </div>
</main>
</body>
</html>
